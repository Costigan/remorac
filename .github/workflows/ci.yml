name: CI

# Note: "on" is quoted so YAML 1.1 parsers don't read the bare key as the
# boolean `true` (the "Norway problem"). GitHub Actions accepts either form.
"on":
  workflow_dispatch:   # Allow manual runs from the Actions tab
  push:
  pull_request:
  schedule:
    # Daily run so a broken main is noticed before the next PR.
    - cron: '0 0 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # RemoraC is a Python project (uv + hatchling). This is the entire CI.
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Validate MLIR toolchain
        run: uv run python tools/validate_mlir_toolchain.py

      - name: Run tests
        run: uv run pytest -q
        env:
          # GitHub-hosted runners have no NVIDIA GPU, so GPU-unavailable must
          # degrade to a skip here rather than the local fail-fast default
          # (tests/conftest.py defaults REMORA_TEST_GPU=1 locally). Set the
          # REMORA_TEST_GPU repository variable to '1' once a self-hosted CUDA
          # runner exists to make GPU coverage mandatory in CI too.
          REMORA_TEST_GPU: ${{ vars.REMORA_TEST_GPU || '0' }}
