name: CI

# Note: "on" is quoted so YAML 1.1 parsers don't read the bare key as the
# boolean `true` (the "Norway problem"). GitHub Actions accepts either form.
"on":
  workflow_dispatch:   # Allow manual runs from the Actions tab
  push:
  pull_request:
  schedule:
    # Daily run so a broken main is noticed before the next PR.
    - cron: '0 0 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # RemoraC is a Python project (uv + hatchling). This is the entire CI.
  python-tests:
    name: Python tests
    # Pinned for reproducibility; the LLVM repo codename below adapts via
    # lsb_release, so a future bump still resolves the right apt.llvm.org repo.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.11
        run: uv python install 3.11

      # The Python deps (iree-compiler) provide IREE's tools but NOT the
      # standalone mlir-opt / mlir-translate / llc that the CPU pipeline and
      # tools/validate_mlir_toolchain.py require, nor the OpenMP runtime the
      # compiled CPU path needs. Install the LLVM/MLIR 18 toolchain from
      # apt.llvm.org. detect_toolchain() finds them via PATH (it tries both the
      # bare and -18-suffixed names); libomp-18-dev lands at the exact path
      # remora/runtime.py probes (/usr/lib/llvm-18/lib/libomp.so).
      - name: Install LLVM/MLIR 18 toolchain
        run: |
          set -euxo pipefail
          codename=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          sudo add-apt-repository -y \
            "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-18 main"
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-tools mlir-18-tools libomp-18-dev
          # Expose the unsuffixed tools (mlir-opt, mlir-translate, llc) on PATH.
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync

      - name: Validate MLIR toolchain
        run: uv run python tools/validate_mlir_toolchain.py

      - name: Run tests
        run: uv run pytest -q
        env:
          # GitHub-hosted runners have no NVIDIA GPU, so GPU-unavailable must
          # degrade to a skip here rather than the local fail-fast default
          # (tests/conftest.py defaults REMORA_TEST_GPU=1 locally). Set the
          # REMORA_TEST_GPU repository variable to '1' once a self-hosted CUDA
          # runner exists to make GPU coverage mandatory in CI too.
          REMORA_TEST_GPU: ${{ vars.REMORA_TEST_GPU || '0' }}
